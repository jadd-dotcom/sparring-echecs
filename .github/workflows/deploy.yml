name: Tests et déploiement GitHub Pages

on:
  # Mise en production : uniquement une poussée sur main (voir la condition du job deploy).
  push:
    branches: [main]
  # Contrôle avant fusion : chaque pull request vers main exécute le job build, sans jamais déployer.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un groupe par branche (ou par pull request) : un contrôle de PR n'annule pas le déploiement de main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # 5 parcours critiques dans Chromium (séance, 10 coups contre Maia, bloc de leçon, ligne, carte de révision).
      - run: npx playwright install --with-deps chromium
      - name: Parcours critiques (Playwright)
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4173/sparring-echecs/ > /dev/null && break; sleep 1; done
          node tests/ci-critical.cjs "$RUNNER_TEMP"
      # Préparation de la publication : inutile pour une pull request, qui ne déploie jamais.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Seule une poussée sur main publie (ni pull request, ni lancement manuel, ni autre branche).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
