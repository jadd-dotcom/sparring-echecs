name: Tests et déploiement GitHub Pages

on:
  push:
    branches: [main, claude/modest-brown-byjuad]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un groupe par branche : une poussée sur la branche de travail n'annule plus le déploiement de main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # L'environnement github-pages n'accepte que la branche principale.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
